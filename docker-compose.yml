version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: futbol_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: player_market
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - futbol-network

  app:
    build: .
    container_name: futbol_app
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/player_market
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:data-migration.sql
      SPRING_SHOW_SQL: "true"
    ports:
      - "8080:8080"
    restart: on-failure
    networks:
      - futbol-network
    mem_limit: 256m
    mem_reservation: 128m

  prometheus:
    image: prom/prometheus:latest
    container_name: futbol_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - futbol-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: futbol_grafana
    ports:
      - "3001:3000"
    networks:
      - futbol-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:

networks:
  futbol-network:
    driver: bridge
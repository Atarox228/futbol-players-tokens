spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/player_market_dev
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
          fetch_size: 50
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

app:
  cache:
    ranking-ttl-minutes: 5

football-data:
  api:
    base-url: https://api.football-data.org/v4
    token: c608aee5d3fd433592def43fcebb5daa
    competition-ids:
      - 2014
      - 2021
      - 2015
      - 2002
      - 2019
      - 2000

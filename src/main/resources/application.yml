server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/player_market}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      connection-timeout: 30000
      idle-timeout: 600000
      validation-timeout: 5000
      leak-detection-threshold: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
          fetch_size: 50
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    display-operation-id: true
    operations-sorter: method
    tags-sorter: alpha

# Actuator & Prometheus Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

# Football-Data.org API Configuration
football-data:
  api:
    base-url: https://api.football-data.org/v4
    token: ${FOOTBALL_DATA_API_TOKEN:}
    competition-ids:
      - 2014  # LaLiga
      - 2021  # Premier League
      - 2015  # Ligue 1
      - 2002  # Bundesliga
      - 2019  # Serie A
      - 2000  # World Cup

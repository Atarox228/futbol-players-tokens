spring:
  datasource:
    url: jdbc:h2:file:./data/player_market;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
          fetch_size: 50
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: never

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    display-operation-id: true
    operations-sorter: method
    tags-sorter: alpha

# Football-Data.org API Configuration
football-data:
  api:
    base-url: https://api.football-data.org/v4
    token: ${FOOTBALL_DATA_API_TOKEN:}
    competition-ids:
      - 2014  # LaLiga
      - 2021  # Premier League
      - 2015  # Ligue 1
      - 2002  # Bundesliga
      - 2019  # Serie A

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: true

  sql:
    init:
      mode: never

  main:
    allow-bean-definition-overriding: true

  cache:
    type: none

  task:
    scheduling:
      pool:
        size: 1
    execution:
      pool:
        core-size: 1
        max-size: 2
        queue-capacity: 100

football-data:
  api:
    base-url: https://api.football-data.org/v4
    token: test-token
    competition-ids:
      - 2014
      - 2021
      - 2015
      - 2002
      - 2019


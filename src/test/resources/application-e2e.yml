spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true

  sql:
    init:
      mode: never

  main:
    allow-bean-definition-overriding: true

  cache:
    type: none

  task:
    scheduling:
      pool:
        size: 1
    execution:
      pool:
        core-size: 1
        max-size: 2
        queue-capacity: 100

football-data:
  api:
    base-url: https://api.football-data.org/v4
    token: e2e-test-token
    competition-ids:
      - 2014
      - 2021
      - 2015
      - 2002
      - 2019

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.DesApp'
version = '0.0.1-SNAPSHOT'
description = 'futbol-players-tokens'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.postgresql:postgresql'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testRuntimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'

    // Selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.15.0'
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.3'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java', 'src/test/repository']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }

    e2e {
        java {
            srcDirs = ['src/e2e/java']
        }
        resources {
            srcDirs = ['src/e2e/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.e2eCompileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.output + configurations.e2eRuntimeClasspath
    }
}

configurations {
    e2eImplementation.extendsFrom implementation
    e2eImplementation.extendsFrom testImplementation
    e2eRuntimeOnly.extendsFrom runtimeOnly
    e2eRuntimeOnly.extendsFrom testRuntimeOnly
    e2eCompileOnly.extendsFrom compileOnly
    e2eCompileOnly.extendsFrom testCompileOnly
    e2eAnnotationProcessor.extendsFrom testAnnotationProcessor
}

def collectTestClassesByAnnotation = { List<File> roots, String annotation ->
    def classNames = []

    roots.findAll { it.exists() }.each { rootDir ->
        fileTree(rootDir) {
            include '**/*Test.java'
            include '**/*Tests.java'
            include '**/*E2ETest.java'
        }.files.each { sourceFile ->
            def content = sourceFile.getText('UTF-8')
            if (!content.contains(annotation)) {
                return
            }

            def packageMatch = (content =~ /(?m)^\s*package\s+([\w\.]+)\s*;/)
            def packageName = packageMatch.find() ? packageMatch.group(1) : null
            def className = sourceFile.name.replace('.java', '')
            classNames << (packageName ? "${packageName}.${className}" : className)
        }
    }

    return classNames.unique().sort()
}

def springBootTests = providers.provider {
    collectTestClassesByAnnotation([file('src/test/java'), file('src/test/repository')], '@SpringBootTest')
}

tasks.named('test') {
    enabled = false
}

def coverageExclusions = [
        '**/config/**',
        '**/modelo/**',
        '**/exception/**',
        '**/controller/dto/**',
        '**/security/**',
        '**/scheduler/**'
]

def filteredMainClasses = {
    sourceSets.main.output.asFileTree.matching {
        exclude coverageExclusions
    }
}

tasks.register('unitTest', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Ejecuta tests unitarios de src/test/java sin contexto Spring.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()

    doFirst {
        filter {
            includeTestsMatching '*'
            springBootTests.get().each { excludeTestsMatching it }
        }
    }

    finalizedBy tasks.named('jacocoUnitTestReport')
}

tasks.register('e2eTest', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Ejecuta tests @SpringBootTest y tests E2E con perfil e2e.'
    testClassesDirs = files(sourceSets.test.output.classesDirs, sourceSets.e2e.output.classesDirs)
    classpath = files(sourceSets.test.runtimeClasspath, sourceSets.e2e.runtimeClasspath)
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'e2e'

    doFirst {
        filter {
            springBootTests.get().each { includeTestsMatching it }
            collectTestClassesByAnnotation([file('src/e2e/java')], 'class ').each { includeTestsMatching it }
        }
    }

    finalizedBy tasks.named('jacocoE2eTestReport')
}

tasks.named('check') {
    dependsOn tasks.named('unitTest')
    dependsOn tasks.named('e2eTest')
}

tasks.register('jacocoUnitTestReport', JacocoReport) {
    dependsOn tasks.named('unitTest')

    executionData(file("${buildDir}/jacoco/unitTest.exec"))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    classDirectories.setFrom(filteredMainClasses())

    reports {
        xml.required = true
        html.required = true
    }

}

tasks.register('jacocoE2eTestReport', JacocoReport) {
    dependsOn tasks.named('e2eTest')

    executionData(file("${buildDir}/jacoco/e2eTest.exec"))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    classDirectories.setFrom(filteredMainClasses())

    reports {
        xml.required = true
        html.required = true
    }

}

tasks.register('jacocoAggregateReport', JacocoReport) {
    dependsOn tasks.named('unitTest')
    dependsOn tasks.named('e2eTest')

    executionData(file("${buildDir}/jacoco/unitTest.exec"), file("${buildDir}/jacoco/e2eTest.exec"))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    classDirectories.setFrom(filteredMainClasses())

    reports {
        xml.required = true
        html.required = true
    }

}

tasks.register('jacocoCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoAggregateReport')

    executionData(tasks.named('unitTest'), tasks.named('e2eTest'))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    classDirectories.setFrom(filteredMainClasses())

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }

}

sonar {
    properties {
        property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY')
        property 'sonar.organization', System.getenv('SONAR_ORGANIZATION')
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/jacocoAggregateReport/jacocoAggregateReport.xml').get().asFile.absolutePath
        property 'sonar.exclusions', coverageExclusions.join(',')
        property 'sonar.qualitygate.wait', 'true'
        property 'sonar.gradle.skipCompile', 'true'
    }
}

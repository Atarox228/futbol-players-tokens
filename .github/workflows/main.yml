name: Java CI con Gradle, Postgres y Docker

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew clean unitTest jacocoUnitTestReport
      env:
        FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}

    - name: Upload Unit Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-unit-html-report
        path: build/reports/jacoco/jacocoUnitTestReport/html

    - name: Upload Unit JaCoCo Exec
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-unit-exec
        path: build/jacoco/unitTest.exec

  e2e-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: player_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run E2E Tests
      run: ./gradlew clean e2eTest jacocoE2eTestReport
      env:
        FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}

    - name: Upload E2E Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-e2e-html-report
        path: build/reports/jacoco/jacocoE2eTestReport/html

    - name: Upload E2E JaCoCo Exec
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-e2e-exec
        path: build/jacoco/e2eTest.exec

  coverage-and-quality:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - e2e-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Unit JaCoCo Exec
      uses: actions/download-artifact@v4
      with:
        name: jacoco-unit-exec
        path: build/jacoco

    - name: Download E2E JaCoCo Exec
      uses: actions/download-artifact@v4
      with:
        name: jacoco-e2e-exec
        path: build/jacoco

    - name: Generate Aggregate Coverage Report
      run: ./gradlew jacocoAggregateReport -x unitTest -x e2eTest

    - name: Enforce Coverage Thresholds
      run: ./gradlew jacocoCoverageVerification -x unitTest -x e2eTest

    - name: SonarCloud Analysis
      run: ./gradlew sonar
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Aggregate Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-aggregate-html-report
        path: build/reports/jacoco/jacocoAggregateReport/html

    - name: Build Docker Image with Docker Compose
      run: docker compose build

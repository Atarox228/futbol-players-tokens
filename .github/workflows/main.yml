name: Java CI con Gradle, Postgres y Docker

on:
  push:
    branches: [ "scrap-jugadores" ]
  pull_request:
    branches: [ "scrap-jugadores" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Levantamos Postgres para los tests de integración
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: player_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Setup-java ya tiene soporte nativo para cachear Gradle
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build
      env:
        # Variables para que Spring conecte a la DB del service de arriba
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/player_market
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: root
        FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

    - name: Build Docker Image with Docker Compose
      # Aquí usamos tu config de docker-compose para el empaquetado final
      run: docker compose build
name: Java CI con Gradle, Redis y Docker

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Postgres NO va acá: los tests E2E lo levantan ellos mismos vía Testcontainers.
      # Redis sí va acá porque algunos tests unitarios se conectan directo (sin Testcontainers).
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        # Setup-java ya tiene soporte nativo para cachear Gradle
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # build -> check -> unitTest + e2eTest + jacocoCoverageVerification
      run: ./gradlew build
      env:
        FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}

    - name: SonarCloud Analysis
      run: ./gradlew sonar
      env:
        FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

    - name: Build Docker Image with Docker Compose
      # Aquí usamos tu config de docker-compose para el empaquetado final
      run: docker compose build
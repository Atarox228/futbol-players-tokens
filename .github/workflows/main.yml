name: Java CI con Gradle, Postgres y Docker

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Levantamos Postgres para los tests de integración
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: player_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Setup-java ya tiene soporte nativo para cachear Gradle
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build
      env:
        FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}

    - name: Generate Coverage Report
      run: ./gradlew jacocoTestReport

    - name: Enforce Coverage Thresholds
      run: ./gradlew jacocoTestCoverageVerification

    - name: SonarCloud Analysis
      run: ./gradlew sonar
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-html-report
        path: build/reports/jacoco/test/html

    - name: Build Docker Image with Docker Compose
      # Aquí usamos tu config de docker-compose para el empaquetado final
      run: docker compose build
